services:
  bot-99freelas:
    build: .
    container_name: bot_99freelas_24h
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DOCKER=1
      # Notificações no Telegram (Opcional - preencha se quiser alertas no celular)
      - TELEGRAM_ALERT_ENABLED=false
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      # Caso queira passar cookies via env em vez de arquivo montado:
      # - SESSION_COOKIES_JSON={"kmlicn": "...", "kmlicin": "..."}
    volumes:
      - ./session_cookies.json:/app/session_cookies.json
      - ./logs:/app/logs
      - ./data:/app/data
